name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile scripts
        run: python -m compileall -q scripts tests

      - name: Smoke test (build a synthetic EPUB, then verify it)
        run: python tests/smoke_test.py

      - name: CLI help sanity
        run: |
          python scripts/build_epub.py --help
          python scripts/verify_epub.py --help

  skill-lint:
    name: SKILL.md frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontmatter has name + description
        run: |
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("SKILL.md").read_text(encoding="utf-8")
          m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
          if not m:
              sys.exit("SKILL.md: missing YAML frontmatter block")
          fm = m.group(1)
          for key in ("name", "description"):
              if not re.search(rf"^{key}:\s*\S", fm, re.M):
                  sys.exit(f"SKILL.md: frontmatter missing {key!r}")
          name = re.search(r"^name:\s*(\S+)", fm, re.M).group(1)
          if name != pathlib.Path.cwd().name:
              sys.exit(f"SKILL.md: name {name!r} does not match repo dir name")
          if len(text.splitlines()) > 500:
              print("warning: SKILL.md is over 500 lines")
          print("SKILL.md frontmatter OK")
          PY
